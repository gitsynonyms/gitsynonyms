name: Download YouTube subtitles
run-name: YouTube subtitles ${{ inputs.request_id || inputs.source }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Video URL/ID or channel videos URL for latest upload
        required: true
        type: string
        default: https://www.youtube.com/@WhiteHouse/videos
      event:
        description: Optional event title override
        required: false
        type: string
      date:
        description: Optional folder date override (YYYY-MM-DD)
        required: false
        type: string
      request_id:
        description: Correlation ID used by the subtitle webpage
        required: false
        type: string
      burn_in:
        description: Download the video and create an MP4 with the ASS subtitles burned in
        required: false
        type: boolean
        default: false
      style_preset:
        description: Caption style preset
        required: false
        type: choice
        options:
          - classic
          - cinema
        default: classic
      box_style:
        description: Subtitle background appearance
        required: false
        type: choice
        options:
          - glass-diamond
          - presidential-blue
          - solid-color
        default: glass-diamond
      chinese_font:
        description: Optional font family override for Chinese captions
        required: false
        type: string
        default: ""
      english_font:
        description: Optional font family override for English captions
        required: false
        type: string
        default: ""
      english_font_size:
        description: Base English font size (Chinese defaults to 1.2 times this)
        required: false
        type: number
        default: 48
      chinese_font_scale:
        description: Chinese font size as a multiple of English size
        required: false
        type: number
        default: 1.2
      chinese_color:
        description: Optional Chinese text color override in #RRGGBB format
        required: false
        type: string
        default: ""
      english_color:
        description: Optional English text color override in #RRGGBB format
        required: false
        type: string
        default: ""
      box_color:
        description: Optional override for the selected background color
        required: false
        type: string
        default: ""
      box_opacity:
        description: Optional box opacity override from 0 (transparent) to 1 (opaque)
        required: false
        type: string
        default: ""
      box_x:
        description: Caption box left coordinate on a 1920x1080 canvas
        required: false
        type: number
        default: 66
      box_y:
        description: Caption box top coordinate on a 1920x1080 canvas
        required: false
        type: number
        default: 883
      box_width:
        description: Caption box width on a 1920x1080 canvas
        required: false
        type: number
        default: 1786
      box_height:
        description: Caption box height on a 1920x1080 canvas
        required: false
        type: number
        default: 139

permissions:
  contents: read

jobs:
  subtitles:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: |
          python -m pip install "yt-dlp[default]"
          deno --version
          yt-dlp --js-runtimes deno --version
      - name: Install FFmpeg for video burn-in
        if: ${{ inputs.burn_in }}
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Download and organize subtitle tracks
        env:
          YOUTUBE_SOURCE: ${{ inputs.source }}
          EVENT_TITLE: ${{ inputs.event }}
          EVENT_DATE: ${{ inputs.date }}
          REQUEST_ID: ${{ inputs.request_id }}
          BURN_IN: ${{ inputs.burn_in }}
          CHINESE_FONT: ${{ inputs.chinese_font }}
          ENGLISH_FONT: ${{ inputs.english_font }}
          ENGLISH_FONT_SIZE: ${{ inputs.english_font_size }}
          CHINESE_FONT_SCALE: ${{ inputs.chinese_font_scale }}
          CHINESE_COLOR: ${{ inputs.chinese_color }}
          ENGLISH_COLOR: ${{ inputs.english_color }}
          BOX_COLOR: ${{ inputs.box_color }}
          BOX_OPACITY: ${{ inputs.box_opacity }}
          BOX_STYLE: ${{ inputs.box_style }}
          STYLE_PRESET: ${{ inputs.style_preset }}
          BOX_X: ${{ inputs.box_x }}
          BOX_Y: ${{ inputs.box_y }}
          BOX_WIDTH: ${{ inputs.box_width }}
          BOX_HEIGHT: ${{ inputs.box_height }}
        shell: bash
        run: |
          source="$YOUTUBE_SOURCE"
          if [[ -n "$REQUEST_ID" && ! "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "Invalid request ID." >&2
            exit 1
          fi
          if [[ "$source" == *youtube.com/@*"/videos"* || "$source" == *youtube.com/channel/*"/videos"* ]]; then
            video_id="$(yt-dlp --no-warnings --flat-playlist --playlist-end 1 --print '%(id)s' "$source" | head -n 1)"
            if [[ -z "$video_id" ]]; then
              echo "Could not resolve the latest channel video from: $source" >&2
              exit 1
            fi
            source="https://www.youtube.com/watch?v=$video_id"
            echo "Resolved latest channel upload: $source"
          fi
          args=("$source" --output-dir output --languages zh-Hans,en-orig)
          args+=(--style-preset "$STYLE_PRESET")
          args+=(--box-display always --box-style "$BOX_STYLE")
          args+=(--chinese-font "$CHINESE_FONT" --english-font "$ENGLISH_FONT")
          args+=(--english-font-size "$ENGLISH_FONT_SIZE" --chinese-font-scale "$CHINESE_FONT_SCALE")
          args+=(--chinese-color "$CHINESE_COLOR" --english-color "$ENGLISH_COLOR")
          if [[ -n "$BOX_COLOR" ]]; then args+=(--box-color "$BOX_COLOR"); fi
          if [[ -n "$BOX_OPACITY" ]]; then args+=(--box-opacity "$BOX_OPACITY"); fi
          args+=(--box-x "$BOX_X" --box-y "$BOX_Y" --box-width "$BOX_WIDTH" --box-height "$BOX_HEIGHT")
          if [[ -n "$EVENT_TITLE" ]]; then args+=(--event "$EVENT_TITLE"); fi
          if [[ -n "$EVENT_DATE" ]]; then args+=(--date "$EVENT_DATE"); fi
          if [[ "$BURN_IN" == "true" ]]; then
            args+=(--burn-in --video-encoder libx264 --global-quality 18)
          fi
          python scripts/download_youtube_bilingual_srt.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-subtitles-${{ inputs.request_id || github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30
