name: Download YouTube subtitles
run-name: YouTube subtitles ${{ inputs.request_id || inputs.source }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Video URL/ID or channel videos URL for latest upload
        required: true
        type: string
        default: https://www.youtube.com/@WhiteHouse/videos
      event:
        description: Optional event title override
        required: false
        type: string
      date:
        description: Optional folder date override (YYYY-MM-DD)
        required: false
        type: string
      request_id:
        description: Correlation ID used by the subtitle webpage
        required: false
        type: string

permissions:
  contents: read

jobs:
  subtitles:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: |
          python -m pip install "yt-dlp[default]"
          deno --version
          yt-dlp --js-runtimes deno --version
      - name: Download and organize subtitle tracks
        env:
          YOUTUBE_SOURCE: ${{ inputs.source }}
          EVENT_TITLE: ${{ inputs.event }}
          EVENT_DATE: ${{ inputs.date }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          source="$YOUTUBE_SOURCE"
          if [[ -n "$REQUEST_ID" && ! "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "Invalid request ID." >&2
            exit 1
          fi
          if [[ "$source" == *youtube.com/@*"/videos"* || "$source" == *youtube.com/channel/*"/videos"* ]]; then
            video_id="$(yt-dlp --no-warnings --flat-playlist --playlist-end 1 --print '%(id)s' "$source" | head -n 1)"
            if [[ -z "$video_id" ]]; then
              echo "Could not resolve the latest channel video from: $source" >&2
              exit 1
            fi
            source="https://www.youtube.com/watch?v=$video_id"
            echo "Resolved latest channel upload: $source"
          fi
          args=("$source" --output-dir output --languages zh-Hans,en-orig)
          if [[ -n "$EVENT_TITLE" ]]; then args+=(--event "$EVENT_TITLE"); fi
          if [[ -n "$EVENT_DATE" ]]; then args+=(--date "$EVENT_DATE"); fi
          python scripts/download_youtube_bilingual_srt.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-subtitles-${{ inputs.request_id || github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30
