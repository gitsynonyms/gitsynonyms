name: Monitor White House Videos
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Reprocess videos that were already archived'
        required: false
        type: boolean
      dry_run:
        description: 'Discover and verify only, do not download'
        required: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whitehouse-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,socks]" requests

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno for yt-dlp
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the proxy index
        continue-on-error: true
        run: |
          python3 proxyindex/build_index.py
          python3 proxyindex/collect.py
          python3 proxyindex/validate.py
          python3 proxyindex/report.py

      - name: Poll the channels and verify new events
        id: poll
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GDELT_API_KEY: ${{ secrets.GDELT_API_KEY }}
          NEWSBANK_API_KEY: ${{ secrets.NEWSBANK_API_KEY }}
        run: |
          python3 scripts/monitoring/comprehensive_monitor.py \
            --force-check "${{ github.event.inputs.force_check }}" \
            --dry-run "${{ github.event.inputs.dry_run }}" \
            | tee monitor.log
          grep -E '^(new_video|title)=' monitor.log >> "$GITHUB_OUTPUT" || true

      - name: Publish the site
        if: steps.poll.outputs.new_video != ''
        run: |
          python3 scripts/generate_video_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ output/
          git commit -m "Publish bilingual burn-in for ${{ steps.poll.outputs.video_id }}" || echo "no site changes"
          git push

      - name: Deploy to Pages
        if: steps.poll.outputs.new_video != ''
        uses: actions/deploy-pages@v4
