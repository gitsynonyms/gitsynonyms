<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>YouTube 字幕下载器</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">GITSYNONYMS · CLOUD CAPTIONS</p>
        <h1>YouTube 字幕下载器</h1>
        <p class="intro">输入视频链接，选择由 GitHub 云端 runner 或本机生成中文、英文单语字幕和中英双语 SRT。</p>
      </header>

      <form id="download-form" class="panel">
        <label for="video-url">YouTube 视频链接</label>
        <input id="video-url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>

        <label for="run-location">运行位置</label>
        <select id="run-location" name="run-location">
          <option value="runner">GitHub 云端 runner</option>
          <option value="local">本地 Anaconda</option>
        </select>

        <button id="submit-button" type="submit">生成运行命令</button>
      </form>

      <section id="status" class="status" aria-live="polite" hidden></section>
      <section id="run-instructions" class="instructions" hidden>
        <h2 id="instructions-title"></h2>
        <p id="instructions-copy" class="hint"></p>
        <pre id="run-command" class="command"></pre>
        <div class="actions">
          <button id="copy-command" type="button">复制命令</button>
          <a id="workflow-link" class="secondary-button" target="_blank" rel="noreferrer" hidden>打开 Actions</a>
        </div>
      </section>

      <footer>
        页面不会要求或保存访问令牌。本地模式仅下载字幕；云端模式使用 GitHub 登录会话或 GitHub CLI 授权启动 Actions。YouTube 可能限制 runner 访问字幕。
      </footer>
    </main>
    <script src="app.js?v=userprofile-python"></script>
  </body>
</html>
